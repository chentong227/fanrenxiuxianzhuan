<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>战斗/演出 预览（开发用）</title>
  <link rel="stylesheet" href="../css/style.css?pv=4" />
  <style>
    .preview-bar { position: fixed; top: 4px; left: 4px; z-index: 999; display: flex; gap: 6px; flex-wrap: wrap; }
    .preview-bar button { font-size: 12px; padding: 4px 8px; }
  </style>
</head>
<body>
  <div id="app">
    <div class="preview-bar">
      <button onclick="PV.encounter()">遭遇战</button>
      <button onclick="PV.showdown()">夺舍之夜</button>
      <button onclick="PV.jinguang()">金光上人</button>
      <button onclick="PV.bt()">心魔战</button>
      <button onclick="PV.story()">剧情演出</button>
      <button onclick="PV.chron()">风云录</button>
      <button onclick="PV.codex()">图鉴</button>
      <button onclick="PV.debug()">探针</button>
    </div>
    <pre id="pv-debug" style="position:fixed;top:34px;left:4px;z-index:999;color:#7fe3c0;font-size:10px;background:rgba(0,0,0,.8);padding:4px;max-width:96vw;white-space:pre-wrap"></pre>

    <!-- 战斗界面 -->
    <div id="combat-overlay" class="combat-overlay" hidden>
      <div id="combat-banner" class="combat-banner" hidden></div>
      <div id="combat-bg" class="combat-bg"></div>
      <div class="combat-veil"></div>
      <div id="combat-cast" class="combat-cast" hidden></div>
      <div class="combat-box">
        <div id="combat-title" class="combat-title">斗 法</div>
        <div class="combat-field">
          <div id="combat-enemies" class="combat-enemies"></div>
          <div class="combat-vs">对</div>
          <div id="combat-player" class="combat-player"></div>
        </div>
        <div class="combat-console">
          <div class="combat-qi" id="combat-qi"></div>
          <div class="combat-spells" id="combat-spells"></div>
          <div class="combat-log" id="combat-log"></div>
          <div class="combat-actions">
            <button class="btn btn-primary" id="combat-endround">结束本回合</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 剧情演出 -->
    <div id="story-overlay" class="story-overlay" hidden>
      <div id="story-bg" class="story-bg"></div>
      <div class="story-scrim"></div>
      <div id="story-portrait-left" class="story-portrait left"></div>
      <div id="story-portrait-right" class="story-portrait right"></div>
      <div class="story-stage-name" id="story-stage-name"></div>
      <div class="story-dialog" id="story-dialog" onclick="UI.storyAdvance()">
        <div class="story-speaker" id="story-speaker"></div>
        <div class="story-text" id="story-text"></div>
        <div class="story-cue" id="story-cue">▽ 轻触继续</div>
      </div>
      <div class="story-choices" id="story-choices"></div>
    </div>

    <div id="modal-overlay" class="modal-overlay" hidden><div id="modal" class="modal"></div></div>
    <div id="toast" class="toast" hidden></div>
    <!-- 渲染兜底用的隐藏桩（覆盖 renderAll 全链路所需 id）-->
    <div style="display:none">
      <div id="narrative"></div><div id="choices"></div><div id="objective-bar"></div>
      <div id="action-buttons"></div><div id="inventory"></div><div id="locals"></div>
      <div id="st-root"></div><div id="st-realm"></div><div id="st-sense"></div>
      <div id="st-speed"></div><div id="st-insight"></div><div id="st-body"></div>
      <div id="st-stones"></div><div id="st-time"></div>
      <div id="cul-text"></div><div id="cul-bar"></div><div id="sp-text"></div><div id="sp-bar"></div>
      <div id="hp-text"></div><div id="hp-bar"></div><div id="mood-text"></div><div id="mood-bar"></div>
      <div id="demon-text"></div><div id="demon-bar"></div>
      <div id="hero-portrait"></div><div id="hero-name"></div><div id="hero-age"></div><div id="hero-lifespan"></div>
      <div id="top-time"></div><div id="loc-name"></div><div id="loc-desc-inline"></div>
      <div id="scene-bg"></div><div id="scene-pins"></div><div id="scene-confirm"></div>
    </div>
  </div>

  <script>
    // 资源路径在 test/ 下需要指向上级
    window.__PREVIEW__ = true;
  </script>
  <script src="../js/data.js"></script>
  <script src="../js/state.js"></script>
  <script src="../js/chapters.js"></script>
  <script src="../js/balance.js"></script>
  <script src="../js/world.js"></script>
  <script src="../js/npcsim.js"></script>
  <script src="../js/interactions.js"></script>
  <script src="../js/combat.js"></script>
  <script src="../js/explore.js"></script>
  <script src="../js/loadout.js"></script>
  <script src="../js/dialogue.js"></script>
  <script src="../js/llm.js"></script>
  <script src="../js/audio.js"></script>
  <script src="../js/art.js"></script>
  <script src="../js/fortunes.js"></script>
  <script src="../js/quests.js"></script>
  <script src="../js/story.js"></script>
  <script src="../js/engine.js"></script>
  <script src="../js/ui.js"></script>
  <script>
    // 修正 Art 路径（预览页位于 test/ 子目录）
    const _artUrl = Art.url.bind(Art);
    Art.url = (id) => { const u = _artUrl(id); return u ? "../" + u : null; };
    const _cgUrl = Art.cgUrl.bind(Art);
    Art.cgUrl = (id) => { const u = _cgUrl(id); return u ? "../" + u : null; };

    State.create("韩立", "si");
    State.data.location = "yaolu";
    State.data.realmIndex = 3;
    State.data.inventory.duyao_cao = 5;
    State.data.inventory.anqi = 5;
    State.save = () => true;   // 预览不落盘

    const PV = {
      encounter() { Engine.startEncounterFight("wolf_gang_thug"); },
      showdown()  { State.data.location = "yaolu"; Engine.startShowdownFight(); },
      jinguang()  {
        // 全套备置演示：符箓×2、金光砖充能、尸傀随行、L2 底细（行徽直接可见）
        const s = State.data;
        s.location = "shanmen";
        State.give("huoshe_fu", 2); State.give("hanbing_fu", 1);
        State.give("jinguang_zhuan", 1); State.give("jinguang_zhuan_charge", 2);
        s.sideUnit = { id: "zhangtie_corpse", name: "铁奴·张铁", hp: 70, hpMax: 70, atk: 12,
                       atkName: "尸傀挥击", nature: "corpse", guard: 0.3, status: "ok", carry: true };
        s.intel = s.intel || {}; s.intel.jinguang = 2;
        Engine.startJinguangFight ? Engine.startJinguangFight() : PV.encounter();
      },
      bt()        { State.data.demon = 60; Engine.startBreakthroughFight({ big: false }); },
      story()     { State.data.location = "qingniu"; UI.renderStory(STORY[0]); },
      chron() {
        // 模拟中期进度：有名声、有勋章、有涟漪窗口、金光已现身
        const s = State.data;
        s.fame = 42; s.flags.jinguang_appeared = true;
        s.medals = { unscathed: 2, giant_slayer: 1 };
        s.milestones = [{ t: "第1年3月", title: "勋章「以下克上」：击败修为高过自己的对手", kind: "medal" }];
        s.rippleWindow = { id: "wolf_bounty", dueAbs: State.absMonth() + 2, note: "镖局悬赏野狼帮喽啰" };
        UI.openChronicle();
      },
      codex() {
        const s = State.data;
        s.metNpcs = ["modafu", "lifeiyu", "jinguang"];
        s.flags.jinguang_appeared = true;
        s.intel = { jinguang: 2 };
        s.intelMoves = { "金光上人": ["金符破空", "剑符斩"] };
        UI.openCodex();
      },
      debug() {
        const box = document.getElementById("combat-enemies");
        const img = box ? box.querySelector(".cfigure img") : null;
        const fig = box ? box.querySelector(".cfigure") : null;
        const lines = [
          "enemies.innerHTML len=" + (box ? box.innerHTML.length : -1),
          "has .cfigure=" + !!fig + "  has img=" + !!img,
        ];
        if (img) {
          const cs = getComputedStyle(img);
          lines.push("img.src=" + img.getAttribute("src"));
          lines.push("complete=" + img.complete + " naturalW=" + img.naturalWidth);
          lines.push("opacity=" + cs.opacity + " display=" + cs.display + " h=" + cs.height + " animName=" + cs.animationName + " playState=" + cs.animationPlayState);
        }
        if (fig) { const fs = getComputedStyle(fig); lines.push("fig h=" + fs.height + " overflow=" + fs.overflow); }
        document.getElementById("pv-debug").textContent = lines.join("\n");
      },
    };
    window.PV = PV;
  </script>
</body>
</html>
