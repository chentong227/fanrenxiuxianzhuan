<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="build" content="250" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <script>
  /* 自动更新（v113 增强）：服务器 ver.txt 为最新版本号。
   * 旧版只在首屏检查一次——iOS 把 PWA/标签页切后台再回来、或从主屏图标恢复时是「resume 旧上下文」，
   * 那次检查不重跑，于是一直停在旧版、要手动强刷。本版改为「每次页面重新可见就复查」
   * （visibilitychange 转可见 + pageshow 的 bfcache 恢复），并保留原有 query（不丢 ?demo=1），
   * 再用 sessionStorage 计数兜住 GitHub Pages CDN 滞后窗口、防重载死循环。 */
  (function () {
    function targetURL(latest) {
      try {
        var u = new URL(location.href);
        u.searchParams.set("b", String(latest)); // set 而非 append：保留 ?demo=1 等其余参数，b 只更新不堆叠
        return u.pathname + u.search + u.hash;
      } catch (e) { return location.pathname + "?b=" + latest; }
    }
    function curBuild() {
      var meta = document.querySelector('meta[name="build"]');
      return parseInt((meta && meta.content) || "0", 10);
    }
    function check() {
      if (document.visibilityState === "hidden") return; // 不可见不查，省电
      fetch("ver.txt?t=" + Date.now(), { cache: "no-store" })
        .then(function (r) { return r.text(); })
        .then(function (t) {
          var latest = parseInt(String(t).trim(), 10);
          if (!latest || latest <= curBuild()) return;
          // 防死循环：同一目标版本本会话最多自动跳 3 次（兜 Pages CDN 仍发旧 HTML 的滞后期）
          var key = "__updTries_" + latest;
          var tries = parseInt(sessionStorage.getItem(key) || "0", 10);
          if (tries >= 3) return;
          try { sessionStorage.setItem(key, String(tries + 1)); } catch (e) {}
          location.replace(targetURL(latest));
        }).catch(function () {});
    }
    try {
      check(); // 首屏
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") check();
      });
      window.addEventListener("pageshow", function (e) {
        if (e && e.persisted) check(); // 从 bfcache 恢复（iOS 返回/前进缓存）
      });
    } catch (e) {}
  })();
  </script>
  <title>凡人修仙传 · 修仙模拟 MVP</title>
  <link rel="stylesheet" href="css/style.css?v=250" />
  <!-- PWA：可装主屏 / 离线可玩 / 全屏（v105 起） -->
  <link rel="manifest" href="manifest.webmanifest?v=250" />
  <meta name="theme-color" content="#14110b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="凡人修仙传" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=250" />
</head>
<body>
  <div id="app">
    <!-- 开局 / 角色创建界面：山门为底，竖排题字 -->
    <section id="screen-create" class="screen active">
      <div class="create-bg"></div>
      <div class="create-veil"></div>
      <div class="create-title-block">
        <h1 class="game-title vertical">凡人修仙传</h1>
        <span class="title-seal">七玄门篇</span>
        <p class="subtitle">凡人之躯 · 逆天改命</p>
      </div>
      <div class="create-box">
        <div class="field">
          <label>道号</label>
          <input id="input-name" type="text" maxlength="6" value="韩立" />
        </div>

        <div class="spirit-root-panel">
          <div class="sr-display">
            <span class="sr-label">灵根资质</span>
            <span id="sr-result" class="sr-result untested">未测</span>
          </div>
          <div id="sr-desc" class="sr-desc">凡人之躯，尚不知有无仙缘。点击下方测试灵根。</div>
          <button id="btn-test-root" class="btn btn-secondary">测 灵 根</button>
        </div>

        <p class="hint">天地灵根稀有，绝大多数修士不过五灵根、伪灵根之流。资质平庸者，唯有以苦修与万全准备弥补天资。</p>

        <button id="btn-start" class="btn btn-primary" disabled>踏 入 此 界</button>
        <button id="btn-load" class="btn btn-ghost">读取存档</button>
        <div class="build-tag">build v250</div>
      </div>
    </section>

    <!-- 主游戏界面：场景大图铺满全屏做底，HUD 浮于其上 -->
    <section id="screen-game" class="screen">
      <!-- 地图主界面（全屏可缩放地图——P1 地图主界面化） -->
      <div id="worldmap-canvas" class="worldmap-canvas" hidden>
        <!-- .wm-world：连续缩放变换层——只装底图与 SVG 路线（位图/矢量随 transform 缩放）。
             pin/文字/头像移到层外、用 JS 投影坐标定位，保证文字图标永远按原生分辨率渲染（不被位图放大糊掉）。 -->
        <div id="wm-world" class="wm-world">
          <div id="worldmap-bg" class="worldmap-bg"></div>
          <div id="worldmap-bg2" class="worldmap-bg wm-bg2"></div>
          <svg id="worldmap-svg" class="worldmap-svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"></svg>
        </div>
        <div id="worldmap-pins" class="worldmap-pins"></div>
        <div id="worldmap-labels" class="worldmap-labels"></div>
        <div id="avatar-pin" class="avatar-pin" hidden>
          <div class="avatar-pin-portrait" id="avatar-pin-portrait"></div>
          <div class="avatar-pin-ring"></div>
        </div>
        <div class="zoom-controls">
          <button class="zoom-btn" id="zoom-in" title="放大">＋</button>
          <button class="zoom-btn" id="zoom-out" title="缩小">－</button>
        </div>
        <button class="hud-toggle" id="hud-toggle" title="切换面板" hidden>☰</button>
        <div class="worldmap-hint" id="worldmap-hint"></div>
        <div id="journey-status" class="journey-status" hidden></div>
      </div>

      <!-- 场景层（全屏底）-->
      <div id="scene-stage" class="scene-stage">
        <!-- 远景气层（2.5D 纵深·空气透视）：data-depth 时点亮，慢于背景半拍漂移 -->
        <div class="scene-far" aria-hidden="true"></div>
        <div id="scene-bg" class="scene-bg"></div>
        <div class="scene-veil"></div>
        <div class="scene-season" aria-hidden="true"></div>
        <!-- 此处由 Env.apply 动态插入 .scene-tint / .scene-weather（染色/天气，z:2）-->
        <!-- 前景框层（2.5D 纵深·近景遮挡）：data-fg 驱动，压在染色之上＝不被染、快于背景漂移 -->
        <div class="scene-fg" aria-hidden="true"></div>
        <div class="scene-head">
          <span class="loc-tag">所在</span>
          <span id="loc-name" class="loc-name">青牛镇</span>
          <span id="loc-desc-inline" class="loc-desc-inline"></span>
        </div>
        <div id="scene-pins" class="scene-pins"></div>
        <div id="scene-hotspots" class="scene-hotspots-layer"></div>
        <!-- 在场人物：立绘站在场景下沿 -->
        <div id="locals" class="locals"></div>
        <div id="scene-confirm" class="scene-confirm"></div>
      </div>

      <header class="topbar">
        <div class="char-brief">
          <span class="game-logo">凡人修仙传</span>
          <span id="top-time" class="t-realm">——</span>
          <div id="month-bar" class="month-bar"></div>
        </div>
        <div class="topbar-actions">
          <button id="btn-atlas" class="btn btn-mini" title="天下舆图 · 人界→大区→国别→据点">舆图</button>
          <button id="btn-bottle" class="btn btn-mini tb-full" title="随身灵圃 · 小绿瓶（随时可唤出打理）" hidden>小瓶</button>
          <button id="btn-codex" class="btn btn-mini tb-full">人物</button>
          <button id="btn-chronicle" class="btn btn-mini tb-full">风云录</button>
          <button id="btn-techniques" class="btn btn-mini tb-full">功法</button>
          <button id="btn-treasury" class="btn btn-mini tb-full">法宝</button>
          <button id="btn-llm" class="btn btn-mini tb-full">活世界</button>
          <button id="btn-sound" class="btn btn-mini tb-full" title="音效开关">♪</button>
          <button id="btn-save" class="btn btn-mini tb-full">存档</button>
          <button id="btn-menu" class="btn btn-mini tb-full">主菜单</button>
          <button id="btn-more" class="btn btn-mini btn-more" title="系统">⋯</button>
        </div>
      </header>

      <!-- 际遇栏（天命/机缘）——独立于 tab 面板，始终可见 -->
      <div id="objective-bar" class="objective-bar"></div>

      <!-- HUD 层 -->
      <main class="layout">
        <!-- 左：韩立卷轴（角色卡 + 状态 + 储物袋）-->
        <aside class="panel side-rail">
          <div class="sr-status">
          <div class="hero-card">
            <div class="hero-portrait" id="hero-portrait" onclick="UI.openHanliSkin()" title="点击换装">🧙</div>
            <div class="hero-meta">
              <div class="hero-name" id="hero-name">韩立</div>
              <div class="hero-realm"><span id="st-realm">练气一层</span> · <span id="st-root">四灵根</span></div>
              <div class="hero-age"><span id="hero-age">13 岁</span> · 寿元 <span id="hero-lifespan">100</span></div>
            </div>
          </div>

          <div class="bar-group">
            <div class="bar-label"><span>修为</span><span id="cul-text">0 / 100</span></div>
            <div class="bar"><div id="cul-bar" class="bar-fill cul"></div></div>
          </div>
          <div class="bar-group">
            <div class="bar-label"><span>灵力</span><span id="sp-text">0 / 100</span></div>
            <div class="bar"><div id="sp-bar" class="bar-fill sp"></div></div>
          </div>
          <div class="bar-group">
            <div class="bar-label"><span>气血</span><span id="hp-text">100</span></div>
            <div class="bar"><div id="hp-bar" class="bar-fill hp"></div></div>
          </div>
          <div class="bar-group">
            <div class="bar-label"><span>心境</span><span id="mood-text">100</span></div>
            <div class="bar"><div id="mood-bar" class="bar-fill mood"></div></div>
          </div>
          <div class="bar-group">
            <div class="bar-label"><span>心魔</span><span id="demon-text">0</span></div>
            <div class="bar"><div id="demon-bar" class="bar-fill demon"></div></div>
          </div>

          <div class="attr-grid">
            <div class="attr-cell" data-tip="神识：比对手高时可看穿其出招意图，并提升命中与暴击；对元神之敌唯靠功力镇压。"><span>神识</span><b id="st-sense">0</b></div>
            <div class="attr-cell" data-tip="遁速：决定战斗先手，并减少大世界赶路耗时（省光阴=省寿元）。"><span>遁速</span><b id="st-speed">0</b></div>
            <div class="attr-cell" data-tip="悟性：突破时更快削减瓶颈心魔，并提升临场顿悟与习功法/炼丹效率。"><span>悟性</span><b id="st-insight">0</b></div>
            <div class="attr-cell" data-tip="体魄：影响气血上限与抗打击。"><span>体魄</span><b id="st-body">0</b></div>
            <div class="attr-cell"><span>灵石</span><b id="st-stones">0</b></div>
            <div class="attr-cell"><span>岁月</span><b id="st-time">——</b></div>
            <div class="attr-cell" data-tip="药理：采药炼丹的熟练度。越高采得越多、炼丹偶得双丹。"><span>药理</span><b id="st-alch">0</b></div>
            <div class="attr-cell" data-tip="探知：山林行走的熟练度。越高越易察觉暗室，16级后探索视野+1。"><span>探知</span><b id="st-scout">0</b></div>
            <div class="attr-cell" data-tip="名声：事迹换来的江湖座次。够高便能登上风云榜（见风云录）。"><span>名声</span><b id="st-fame">0</b></div>
          </div>

          </div><!-- /.sr-status -->

          <div class="sr-bag">
            <h3 class="panel-title">储物袋</h3>
            <div id="inv-cats" class="inv-cats"></div>
            <div id="inventory" class="inventory"></div>
          </div>
        </aside>

        <!-- 中下：行动栏（刚刚发生 + 当前可做）-->
        <section class="panel mid-col">
          <div id="recent-log" class="recent-log" onclick="UI.openChronicle&&UI.openChronicle()" title="查看完整见闻"></div>
          <div id="action-buttons" class="action-buttons"></div>
        </section>

        <!-- 右：叙事卷轴（日志 + 抉择）-->
        <section class="panel stage-col">
          <h3 class="panel-title">见闻</h3>
          <div id="narrative" class="narrative"></div>
          <div id="choices" class="choices"></div>
        </section>
      </main>

      <!-- 据点级行动 sheet（地图主界面：底部可拉起的统一面板——行动+见闻合一） -->
      <div id="action-dock" class="action-dock" hidden>
        <div class="action-dock-grip" id="dock-grip"></div>
        <div class="dock-head" id="dock-head">
          <span class="dock-loc" id="dock-loc">所在</span>
          <span class="dock-obj" id="dock-obj"></span>
        </div>
        <div class="dock-tabs" id="dock-tabs">
          <button class="dock-tab active" data-dtab="act">行动</button>
          <button class="dock-tab" data-dtab="news">见闻</button>
        </div>
        <div class="dock-body">
          <div id="dock-actions" class="dock-actions" data-dpane="act"></div>
          <div id="dock-news" class="dock-news" data-dpane="news" hidden></div>
        </div>
      </div>

      <!-- 手机底部分页栏（窄屏显示，桌面隐藏）：舆图 / 行动 / 状态 -->
      <nav class="mobile-tabs" id="mobile-tabs">
        <button class="mtab" data-tab="map">舆图</button>
        <button class="mtab active" data-tab="act">行动</button>
        <button class="mtab" data-tab="hero">状态</button>
      </nav>
    </section>

    <!-- 战斗界面：对阵轴立绘战场（场景做底，单位按格站位，下方法力池+手牌）-->
    <div id="combat-overlay" class="combat-overlay" hidden>
      <div id="combat-banner" class="combat-banner" hidden></div>
      <div id="combat-bg" class="combat-bg"></div>
      <div id="combat-bgmid" class="combat-bgmid"></div>
      <div id="combat-sky" class="combat-sky"></div>
      <div id="combat-fg" class="combat-fg"></div>
      <div class="combat-veil"></div>
      <div id="combat-grade" class="combat-grade"></div>
      <div id="combat-cast" class="combat-cast" hidden></div>
      <div class="combat-box">
        <div class="combat-tophud">
          <div id="combat-title" class="combat-title">斗 法</div>
          <div id="combat-round" class="combat-roundnum"></div>
        </div>
        <div id="axis-field" class="axis-field">
          <div id="axis-units" class="axis-units"></div>
          <div id="axis-lane" class="axis-lane"></div>
          <div id="combat-floats" class="combat-floats"></div>
          <button id="combat-logbtn" class="logbtn-corner" title="完整战录">录</button>
        </div>
        <div id="combat-intent" class="combat-intent" hidden></div>
        <div id="combat-fieldcycle" class="combat-fieldcycle" hidden></div>
        <div class="combat-console">
          <div class="combat-mprow" id="combat-mprow"></div>
          <div class="combat-spells" id="combat-spells"></div>
          <div id="quick-row" class="quick-row"></div>
          <div id="pet-row" class="quick-row pet-row" hidden></div>
          <div class="combat-log" id="combat-log" hidden></div>
          <div class="combat-actions">
            <button class="btn btn-secondary btn-mini" id="combat-survey" title="观阵 · 拉远看全战场">观阵</button>
            <button class="btn btn-secondary btn-mini" id="combat-quick" hidden>速战速决</button>
            <button class="btn btn-secondary btn-mini" id="combat-fly" hidden onclick="Engine.combatFly()">升空</button>
            <button class="btn btn-secondary btn-mini" id="combat-flee" hidden>遁走</button>
            <button class="btn btn-primary" id="combat-endround">结束回合</button>
          </div>
        </div>
        <div id="fx-global" class="fx-global" hidden></div>
        <!-- 战斗结算卡：胜负到底发生了什么，看清楚再走 -->
        <div id="combat-outro" class="combat-outro" hidden>
          <div class="co-card">
            <div id="co-result" class="co-result">胜</div>
            <div id="co-foes" class="co-foes"></div>
            <div id="co-detail" class="co-detail"></div>
            <div id="co-loot" class="co-loot"></div>
            <button id="co-confirm" class="btn btn-primary">收 功</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 箱庭探索界面（副本/秘境走格子）-->
    <div id="explore-overlay" class="explore-overlay" hidden>
      <div class="explore-box">
        <div class="explore-head">
          <span id="explore-title" class="explore-title">秘境</span>
          <span id="explore-info" class="explore-info"></span>
          <button id="explore-leave" class="btn btn-mini">离开</button>
        </div>
        <div class="explore-main">
          <div id="explore-grid" class="explore-grid"></div>
          <div class="explore-side">
            <div class="explore-minimap-wrap">
              <div class="minimap-label">小地图（点开看全图）</div>
              <div id="explore-minimap" class="explore-minimap"></div>
            </div>
            <div id="explore-bag" class="explore-bag"></div>
          </div>
        </div>
        <div class="explore-log" id="explore-log"></div>
        <div class="explore-dpad">
          <div></div>
          <button class="dpad-btn" data-dir="up">↑</button>
          <div></div>
          <button class="dpad-btn" data-dir="left">←</button>
          <button class="dpad-btn dpad-center" data-dir="">·</button>
          <button class="dpad-btn" data-dir="right">→</button>
          <div></div>
          <button class="dpad-btn" data-dir="down">↓</button>
          <div></div>
        </div>
      </div>
    </div>

    <!-- 箱庭探索 v3：L1 舆图（水墨节点图）+ L3 横版深窟（段落制）-->
    <div id="exmap-overlay" class="exmap-overlay" hidden>
      <div id="exmap-bg" class="exmap-bg"></div>
      <div class="exmap-veil"></div>
      <!-- L1 舆图层 -->
      <div id="exmap-field" class="exmap-field">
        <div class="exmap-head">
          <div id="exmap-title" class="exmap-title">血色禁地</div>
          <div id="exmap-clock" class="exmap-clock"></div>
        </div>
        <svg id="exmap-edges" class="exmap-edges" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
        <div id="exmap-nodes" class="exmap-nodes"></div>
        <div id="exmap-actions" class="exmap-actions"></div>
      </div>
      <!-- L3 横版段落层 -->
      <div id="exmap-scene" class="exmap-scene" hidden>
        <div id="exmap-scene-stage" class="exmap-scene-stage"></div>
        <div id="exmap-scene-panel" class="exmap-scene-panel"></div>
      </div>
      <!-- 见闻字幕（L1/L3 共用——挂在最上层，洞窟里也看得见） -->
      <div id="exmap-notes" class="exmap-notes"></div>
    </div>

    <!-- 剧情演出（视觉小说式：双人相对立绘 + 逐句推进）-->
    <div id="story-overlay" class="story-overlay" hidden>
      <div id="story-far" class="story-far"></div>
      <div id="story-bg" class="story-bg"></div>
      <div class="story-scrim"></div>
      <div class="story-skip" id="story-skip" onclick="UI.storySkip()" hidden>跳过 ⏭</div>
      <div id="story-portrait-left" class="story-portrait left"></div>
      <div id="story-portrait-right" class="story-portrait right"></div>
      <div class="story-stage-name" id="story-stage-name"></div>
      <div class="story-dialog" id="story-dialog" onclick="UI.storyAdvance()">
        <div class="story-speaker" id="story-speaker"></div>
        <div class="story-text" id="story-text"></div>
        <div class="story-cue" id="story-cue">▼ 轻触继续</div>
      </div>
      <div class="story-choices" id="story-choices"></div>
    </div>

    <!-- 箱庭舞台（Stage Scene）：横版轴+单位+对话气泡，复用 L3 渲染管线 -->
    <div id="stage-overlay" class="stage-overlay" hidden>
      <div id="stage-bg" class="stage-bg"></div>
      <div id="stage-track" class="stage-track">
        <div id="stage-lane" class="axis-lane stage-lane"></div>
        <div id="stage-units" class="axis-units"></div>
      </div>
      <div id="stage-bubble" class="stage-bubble"></div>
      <div id="stage-note" class="stage-note"></div>
      <div id="stage-choice" class="stage-choice"></div>
    </div>
